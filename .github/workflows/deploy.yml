name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Inject Gist token
        run: |
          sed -i "s/__GIST_TOKEN__/${{ secrets.GIST_TOKEN }}/g" app.js
          sed -i "s/__GIST_TOKEN__/${{ secrets.GIST_TOKEN }}/g" vocabgendertraining/app.js

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - uses: actions/deploy-pages@v4
        id: deployment
